version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: buildmarket_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./db:/dump_data
    environment:
      MONGO_INITDB_DATABASE: materials_db
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: buildmarket_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buildmarket_app
    ports:
      - "8080:8080"  # Proxy will run on 8080
      - "8040:8040"  # Backend will run on 8040
    depends_on:
      - redis
      - mongo
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: buildmarket_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mongo-data:
