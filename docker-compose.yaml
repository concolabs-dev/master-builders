version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: buildmarket_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./db:/dump_data
      - ./init-mongo/script.sh:/docker-entrypoint-initdb.d/init-mongo.sh
    environment:
      MONGO_INITDB_DATABASE: materials_db
    restart: unless-stopped

  app1:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: buildmarket_app1
    expose:
      - "8040"
    environment:
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      - mongo
    restart: unless-stopped

  app2:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: buildmarket_app2
    expose:
      - "8040"
    environment:
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      - mongo
    restart: unless-stopped

  app3:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: buildmarket_app
    ports:
      - "${APP_PORT_HOST:-8030}:8030"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      - mongo
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: buildmarket_nginx
    ports:
      - "8040:8040"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
    restart: unless-stopped

volumes:
  mongo-data:
