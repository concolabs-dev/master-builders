name: Deploy to EC2 Test

on:
  push:
    branches: [ "test" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Checkout code
    - uses: actions/checkout@v4

    # Set up Go
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    # Build the Go binary
    - name: Build
      run: go build -o bin/build-market-backend

    # Copy binary to EC2 server
    - name: Copy binary to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST_TEST }}
        username: ${{ secrets.EC2_USER_TEST }}
        port: ${{ secrets.EC2_PORT_TEST }}
        key: ${{ secrets.EC2_PEM_KEY_TEST }}
        source: "bin/build-market-backend"
        target: "~/deploy/"

    # Restart service on EC2
    - name: Restart service on server
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.EC2_HOST_TEST }}
        username: ${{ secrets.EC2_USER_TEST }}
        port: ${{ secrets.EC2_PORT_TEST }}
        key: ${{ secrets.EC2_PEM_KEY_TEST }}
        script: |
          # Ensure deploy directory exists
          mkdir -p ~/deploy
          chmod 755 ~/deploy

          # Move binary to proper location
          sudo mv ~/deploy/bin/build-market-backend /usr/local/bin/build-market-backend
          sudo chmod +x /usr/local/bin/build-market-backend

          # Reload systemd and restart the service
          sudo systemctl daemon-reload
          sudo systemctl restart build-market-backend
          sudo systemctl status build-market-backend--no-pager